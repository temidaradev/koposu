name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Package
        run: mkdir -p dist && scripts/package.sh "${GITHUB_REF_NAME}" | tee dist/listing.json
      - uses: actions/upload-artifact@v4
        with:
          name: koposu
          path: dist/
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/kopuz-plugin.toml dist/plugin.wasm \
            --title "koposu $GITHUB_REF_NAME" \
            --notes "Marketplace listing for Kopuz-org/plugins:

          \`\`\`json
          $(cat dist/listing.json)
          \`\`\`"
